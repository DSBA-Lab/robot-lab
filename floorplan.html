<title>DSBA Robot Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: an application shell, not a page of cards. Top bar, catalog rail left, the drawing next to it, robots on the right.
   The drawing column is only as wide as the room needs at the current window height (the room is 347 × 848, so it is narrow);
   everything left over goes to the robot side. When that side is wide enough it splits into a 3D viewport and a settings column.
   Regions are split by hairlines and the drawing is the only white surface. UI stays monochrome; blue means "selected / robot reach", red means "collision".
   The plan follows drafting conventions: solid cut walls, lighter object lines, lightest dimension lines with 45° ticks. Stacks to one column under 1080px. */
:root{
  --paper:#f4f5f7; --panel:#f9fafb; --sheet:#e9ebef; --floor:#ffffff;
  --ink:#1c1f26; --ink-2:#5f6672; --ink-3:#8b919c;
  --line:#dfe2e7; --line-2:#c6cad2;
  --hover:rgba(28,31,38,.05); --press:rgba(28,31,38,.09);
  --grid:#f1f2f5; --grid-mid:#e7e9ed; --grid-major:#d6d9df;
  --wall:#2a2e37; --glass:#ffffff;
  --accent:#2c5fc9; --accent-ink:#234da6; --accent-soft:rgba(44,95,201,.09);
  --furn-fill:#eef0f3; --furn-line:#7b828e;
  --robot-fill:#262a33; --robot-line:#1c1f26; --robot-ink:#ffffff;
  --equip-fill:#dfe2e7; --equip-line:#5f6672;
  --zone-fill:rgba(28,31,38,.04); --zone-line:#8b919c;
  --reach-fill:rgba(44,95,201,.055); --reach-line:rgba(44,95,201,.5);
  --bad:#c93a3a; --bad-fill:rgba(201,58,58,.16); --ok:#2e7d4f;
  --stage3d:#dde0e5; --stage3d-hi:#e7e9ed; --stage-grid:#c2c7cf; --stage-axis:#9aa0ab;
  --font-ui:"Inter","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-data:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15171b; --panel:#181a1f; --sheet:#101215; --floor:#1e2127;
    --ink:#e7e9ed; --ink-2:#a0a6b1; --ink-3:#727884;
    --line:#2b2f37; --line-2:#3c414b;
    --hover:rgba(231,233,237,.06); --press:rgba(231,233,237,.11);
    --grid:#23262d; --grid-mid:#292d35; --grid-major:#353a44;
    --wall:#c9cdd5; --glass:#1e2127;
    --accent:#7ea6f4; --accent-ink:#9dbcf7; --accent-soft:rgba(126,166,244,.14);
    --furn-fill:#292d35; --furn-line:#8b919c;
    --robot-fill:#dfe2e7; --robot-line:#e7e9ed; --robot-ink:#15171b;
    --equip-fill:#333842; --equip-line:#a0a6b1;
    --zone-fill:rgba(231,233,237,.05); --zone-line:#727884;
    --reach-fill:rgba(126,166,244,.08); --reach-line:rgba(126,166,244,.6);
    --bad:#f07070; --bad-fill:rgba(240,112,112,.22); --ok:#62c48a;
    --stage3d:#3b404a; --stage3d-hi:#454b56; --stage-grid:#565c68; --stage-axis:#7d8492;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15171b; --panel:#181a1f; --sheet:#101215; --floor:#1e2127;
  --ink:#e7e9ed; --ink-2:#a0a6b1; --ink-3:#727884;
  --line:#2b2f37; --line-2:#3c414b;
  --hover:rgba(231,233,237,.06); --press:rgba(231,233,237,.11);
  --grid:#23262d; --grid-mid:#292d35; --grid-major:#353a44;
  --wall:#c9cdd5; --glass:#1e2127;
  --accent:#7ea6f4; --accent-ink:#9dbcf7; --accent-soft:rgba(126,166,244,.14);
  --furn-fill:#292d35; --furn-line:#8b919c;
  --robot-fill:#dfe2e7; --robot-line:#e7e9ed; --robot-ink:#15171b;
  --equip-fill:#333842; --equip-line:#a0a6b1;
  --zone-fill:rgba(231,233,237,.05); --zone-line:#727884;
  --reach-fill:rgba(126,166,244,.08); --reach-line:rgba(126,166,244,.6);
  --bad:#f07070; --bad-fill:rgba(240,112,112,.22); --ok:#62c48a;
  --stage3d:#3b404a; --stage3d-hi:#454b56; --stage-grid:#565c68; --stage-axis:#7d8492;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;min-height:44px;padding-block:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:var(--panel)}
.bar h1{display:flex;align-items:center;gap:8px;margin:0 auto 0 0;font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.bar h1 img{flex:none;width:22px;height:22px;display:block}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.tg{display:flex;align-items:center;gap:2px}
.tg + .tg{padding-left:10px;border-left:1px solid var(--line)}
.tg button,.tg label{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border:0;border-radius:4px;background:transparent;font-size:13px;white-space:nowrap}
.tg button{cursor:pointer}
.tg button:hover:not(:disabled){background:var(--hover)}
.tg button:active:not(:disabled){background:var(--press)}
.tg button:disabled{color:var(--ink-3);cursor:default}
.tg button[aria-pressed="true"]{background:var(--press);font-weight:500}
.tg label{color:var(--ink-2);padding-right:4px}
.tg select{height:24px;border:1px solid var(--line-2);border-radius:4px;background:var(--floor);padding:0 2px;font-family:var(--font-data);font-size:12px;color:var(--ink)}
#t-fit{min-width:54px;justify-content:center;font-family:var(--font-data);font-size:12px;font-variant-numeric:tabular-nums}
#t-zin,#t-zout{width:28px;justify-content:center;padding:0;font-size:16px;line-height:1}

/* work area */
/* Drawing column width = fitted room width at this window height + side margins.
   Stage height is 100vh − 44 (bar) − 27 (status); the plan keeps 28 + 58 px above/below and 36 + 68 px left/right (VIEW_PAD in the script),
   and room + walls is 371 × 872 cm, so width = (100vh − 71 − 86) × 371/872 + 104, plus 8 px of slack. */
.work{display:grid;grid-template-columns:clamp(216px,15vw,236px) clamp(320px,calc((100vh - 157px) * .4255 + 112px),44vw) minmax(0,1fr);min-height:0}
.work.big{grid-template-columns:minmax(0,1fr)}
.work.big .rail,.work.big .sheet{display:none}
.rail,.side{overflow-y:auto;min-height:0;min-width:0;background:var(--panel);scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.rail{border-right:1px solid var(--line)}
.side{border-left:1px solid var(--line);container:side / inline-size}
.sec{padding:14px 16px 16px;border-bottom:1px solid var(--line)}
.rail .sec{padding-left:max(16px,env(safe-area-inset-left,0px))}
.side .sec{padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec h2{margin:0 0 10px;font-size:12px;font-weight:600}
.sec h3{margin:14px 0 4px;font-size:12px;font-weight:500;color:var(--ink-2)}
.sec h3:first-of-type{margin-top:0}
.note{margin:10px 0 0;font-size:12px;color:var(--ink-2)}

.cat{display:grid;grid-template-columns:1fr;margin-inline:-8px}
.cat button{display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:8px;height:28px;padding:0 8px;
  border:0;border-radius:4px;background:transparent;text-align:left;cursor:pointer}
.cat button:hover{background:var(--hover)}
.cat button:active{background:var(--press)}
.cat .sw{width:12px;height:9px;border:1.25px solid var(--furn-line);background:var(--furn-fill);border-radius:1px}
.cat .sw.robot{border-color:var(--robot-line);background:var(--robot-fill)}
.cat .sw.equip{border-color:var(--equip-line);background:var(--equip-fill)}
.cat .sw.zone{border-color:var(--zone-line);background:var(--zone-fill);border-style:dashed}
.cat .sw.round{width:11px;height:11px;border-radius:50%}
.cat .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .dm{font-family:var(--font-data);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

details.sec > summary{cursor:pointer;font-size:12px;font-weight:600;list-style-position:inside}
details.sec[open] > summary{margin-bottom:10px}
.keys{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12px;align-items:baseline}
.keys dt{justify-self:start;font-family:var(--font-data);font-size:11px;border:1px solid var(--line-2);border-radius:3px;padding:0 5px;background:var(--floor);white-space:nowrap}
.keys dd{margin:0;color:var(--ink-2)}

/* form controls */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fld{display:flex;align-items:center;gap:8px;min-width:0;height:28px;padding:0 8px;border:1px solid var(--line-2);border-radius:4px;background:var(--floor)}
.fld:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fld > span{flex:none;font-size:12px;color:var(--ink-2);white-space:nowrap}
.fld > .u{font-family:var(--font-data);font-size:11px;color:var(--ink-3)}
.fld input{flex:1 1 0;min-width:0;width:100%;height:100%;border:0;outline:0;background:transparent;padding:0;text-align:right;font-size:12px}
.fld input[type="number"]{font-family:var(--font-data);font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.fld input[type="number"]::-webkit-inner-spin-button,.fld input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.fld.wide{margin-bottom:6px}
.fld.wide input{text-align:left;font-size:13px}
.chk{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px}
.chk input{accent-color:var(--accent);margin:0}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{height:28px;padding:0 10px;border:1px solid var(--line-2);border-radius:4px;background:var(--floor);font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:active{background:var(--paper)}
.btn.danger{color:var(--bad)}
.btn.sm{height:24px;padding:0 8px}
.btn[aria-pressed="true"]{background:var(--press);border-color:var(--ink-2);font-weight:500}

.read{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px}
.read dt{color:var(--ink-2)}
.read dd{margin:0;font-family:var(--font-data);font-size:11.5px;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere}
.warns{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:12px;color:var(--bad)}
.warns li{display:flex;align-items:baseline;gap:7px}
.warns li::before{content:"";flex:none;width:6px;height:6px;background:var(--bad);transform:translateY(-1px)}

.olist{margin:0 -8px;padding:0;list-style:none}
.olist li.note{margin:0 8px}
.olist button{width:100%;display:grid;grid-template-columns:6px minmax(0,1fr) auto;align-items:center;gap:10px;height:28px;padding:0 8px;
  border:0;border-radius:4px;background:transparent;text-align:left;cursor:pointer}
.olist button:hover{background:var(--hover)}
.olist button[aria-current="true"]{background:var(--accent-soft)}
.olist .dot{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.olist .dot.bad{background:var(--bad)}
.olist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.olist .dm{font-family:var(--font-data);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* robot side: gallery of all robots, or the 3D viewport of one */
.show{position:relative;border-bottom:1px solid var(--line);background:var(--stage3d)}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line-2)}
.gt{position:relative;display:block;min-width:0;min-height:0;padding:0;border:0;border-radius:0;background:var(--stage3d);aspect-ratio:1/1;overflow:hidden;text-align:left;cursor:pointer}
.gt:first-child{grid-column:1/-1;aspect-ratio:2/1}
.gt:hover,.gt:focus-visible{background:var(--stage3d-hi)}
.gt:focus-visible{outline-offset:-2px}
.gt canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.gt-cap{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:44px;bottom:10px;display:grid;gap:1px;pointer-events:none}
.gt-nm{font-size:13px;font-weight:600;letter-spacing:-.01em}
.gt-mk{font-size:11px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt-go,.vb{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line-2);border-radius:4px;background:var(--floor);color:var(--ink-2)}
.gt-go{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px))}
.gt-go svg,.vb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gt:hover .gt-go,.gt:focus-visible .gt-go{color:var(--floor);background:var(--accent);border-color:var(--accent)}
.gt:active .gt-go{background:var(--accent-ink);border-color:var(--accent-ink)}
.gt.loading::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border:1.5px solid var(--line-2);border-top-color:var(--ink-2);border-radius:50%}
.mv-view{position:relative}
.mv-stage{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden}
.mv-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.mv-stage canvas:active{cursor:grabbing}
.mv-msg{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:12px;text-align:center;font-size:12px;color:var(--ink-2);pointer-events:none}
.vb{position:absolute;top:10px;padding:0;cursor:pointer}
.vb:hover{color:var(--ink);border-color:var(--ink-3)}
.vb:active{background:var(--paper)}
#mv-back{left:max(10px,env(safe-area-inset-left,0px))}
#mv-big{right:max(10px,env(safe-area-inset-right,0px))}
.mv-head h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.mv-tag{margin:2px 0 0;font-size:12px;color:var(--ink-2)}
.mv-ctl{margin-top:14px}
.mv-ctl h3{margin:16px 0 8px;color:var(--ink);font-weight:600}
.mv-ctl .row{margin-top:0}
.mv-jhead{display:flex;align-items:center;gap:12px;margin:16px 0 8px}
.mv-jhead h3{margin:0 auto 0 0}
.mv-jhead .chk{margin:0}
#mv-joints{display:grid;gap:12px 24px}
#mv-joints.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.mv-grp h4{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--ink-2)}
.mv-rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 24px}
.jr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:0 8px}
.jr .jl{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr .jv{font-family:var(--font-data);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.jr input[type="range"]{grid-column:1/-1;-webkit-appearance:none;appearance:none;width:100%;height:20px;margin:0;background:transparent;cursor:pointer;--a:0%;--b:0%}
.jr input[type="range"]::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:linear-gradient(to right,var(--line-2) 0 var(--a),var(--ink) var(--a) var(--b),var(--line-2) var(--b) 100%)}
.jr input[type="range"]::-moz-range-track{height:2px;border-radius:1px;background:linear-gradient(to right,var(--line-2) 0 var(--a),var(--ink) var(--a) var(--b),var(--line-2) var(--b) 100%)}
.jr input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;border-radius:50%;background:var(--floor);border:1.5px solid var(--ink)}
.jr input[type="range"]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--floor);border:1.5px solid var(--ink)}
.jr input[type="range"]:hover::-webkit-slider-thumb,.jr input[type="range"]:active::-webkit-slider-thumb{border-color:var(--accent)}
.jr input[type="range"]:hover::-moz-range-thumb,.jr input[type="range"]:active::-moz-range-thumb{border-color:var(--accent)}
.spec{margin:0;display:grid;grid-template-columns:minmax(92px,auto) minmax(0,1fr);font-size:12px}
.spec dt,.spec dd{margin:0;padding:6px 0;border-top:1px solid var(--line)}
.spec dt{color:var(--ink-2);padding-right:16px}
.spec dd{overflow-wrap:anywhere}
.mv a{color:var(--accent-ink);text-underline-offset:2px}
/* wide robot side: viewport on the left, settings column on the right */
@container side (min-width:720px){
  .side-in{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,34cqw,420px);align-items:start}
  .show{position:sticky;top:0;border-bottom:0}
  .col{border-left:1px solid var(--line)}
}

/* drawing sheet */
.sheet{display:grid;grid-template-rows:minmax(0,1fr) auto;background:var(--sheet);overflow:hidden;min-width:0;min-height:0;position:relative;container:sheet / inline-size}
#stage{position:relative;min-height:0;min-width:0;overflow:hidden}
#plan{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
#plan.measuring{cursor:crosshair}
#plan.panning{cursor:grabbing}
.status{display:flex;gap:16px;overflow:hidden;white-space:nowrap;padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-top:1px solid var(--line);background:var(--panel);font-family:var(--font-data);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.status b{font-weight:500;color:var(--ink)}
.status .warn{color:var(--bad)}
.status .cur{margin-left:auto}
@container sheet (max-width:560px){.status .leg{display:none}}
@container sheet (max-width:400px){.status .cur{display:none}}
.toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--floor);
  border-radius:4px;padding:6px 12px;font-size:12px;pointer-events:none}

/* svg drawing */
#plan text{font-family:var(--font-ui)}
.floor{fill:var(--floor)}
.g-minor{stroke:var(--grid);fill:none}
.g-mid{stroke:var(--grid-mid);fill:none}
.g-major{stroke:var(--grid-major);fill:none}
.wall{fill:var(--wall)}
.opening{fill:var(--sheet)}
.door-leaf{stroke:var(--wall);fill:none}
.door-arc{stroke:var(--ink-3);fill:none}
.win{fill:var(--glass);stroke:var(--wall)}
.win-line{stroke:var(--wall);fill:none}
.tag{fill:var(--ink-3)}
.dim line{stroke:var(--ink-3);fill:none}
.dim text{fill:var(--ink-2);font-family:var(--font-data)!important}
.item{cursor:grab}
.item.locked{cursor:default}
.item .body{fill:var(--furn-fill);stroke:var(--furn-line)}
.item.cat-robot .body{fill:var(--robot-fill);stroke:var(--robot-line)}
.item.cat-equip .body{fill:var(--equip-fill);stroke:var(--equip-line)}
.item.cat-zone .body{fill:var(--zone-fill);stroke:var(--zone-line)}
.item .mark{fill:var(--robot-ink);stroke:none}
.item .lbl{fill:var(--ink);pointer-events:none}
.item .lbl.sub{fill:var(--ink-2);font-family:var(--font-data)!important}
.item.cat-robot .lbl:not(.out){fill:var(--robot-ink)}
.item .lbl.out{paint-order:stroke;stroke:var(--floor);stroke-linejoin:round}
.item.bad .body{fill:var(--bad-fill);stroke:var(--bad)}
.item.bad .lbl:not(.out){fill:var(--ink)}
.item.bad .mark{fill:var(--bad)}
.hatch-line{stroke:var(--zone-line);opacity:.45}
.hatch{pointer-events:none}
.reach{fill:var(--reach-fill);stroke:var(--reach-line);pointer-events:none}
.sel-outline{fill:none;stroke:var(--accent);pointer-events:none}
.stem{stroke:var(--accent);fill:none;pointer-events:none}
.handle{fill:var(--floor);stroke:var(--accent);cursor:crosshair}
.hit{fill:transparent;cursor:crosshair}
.hit-pad{fill:transparent;stroke:none}
.clr line{stroke:var(--accent);fill:none;pointer-events:none}
.clr text{fill:var(--accent-ink);font-family:var(--font-data)!important;paint-order:stroke;stroke:var(--floor);stroke-linejoin:round;pointer-events:none}
.meas line{stroke:var(--ink);fill:none;pointer-events:none}

<script>
(() => {
'use strict';

/* ───────── constants ───────── */
const LS_STATE = 'pai-lab-plan-v1';
const LS_UI = 'pai-lab-plan-ui-v1';
const WALL_T = 12;
const ROOM = { w: 347, d: 848, doorX: 20, doorW: 100, hinge: 'left', swing: 'in', winX: 30, winW: 287 }; // 확정값 (cm): 문은 왼쪽 벽에서 20, 경첩 왼쪽, 안쪽으로 열림
const SPECS = {
  openarm2: 'OpenArm 2.0 · 양팔 7자유도 · 팔 리치 606 mm, 팔당 5.5 kg (공식 문서) · 베이스 플레이트 19 × 25 cm, 팔을 내린 전체 폭 41 cm, 어깨 간격 30.5 cm (공식 URDF 모델 기준).',
  xarm7: 'UFACTORY xArm 7 · 7자유도 · 가반하중 3.5 kg · 리치 700 mm · 베이스 Ø126 mm · 본체 13.7 kg · 별도 컨트롤 박스가 필요합니다.',
  so101: 'SO-101 · 베이스 약 11 × 9 cm (공개 CAD 기준) · 리치 약 44 cm (공개 URDF 링크 길이 합산, 그리퍼 끝 기준).',
};
const TOP_TYPES = new Set(['openarm2', 'xarm7', 'so101', 'arm', 'pc']); // 책상·테이블 위에 올릴 수 있는 것
const CATALOG = [
  { group: '로봇', items: [
    { type: 'openarm2', name: 'OpenArm 2.0', w: 41,   d: 25,   reach: 60.6, armOff: 15.25, cat: 'robot' },
    { type: 'xarm7',    name: 'xArm7',       w: 12.6, d: 12.6, reach: 70,   cat: 'robot', round: true },
    { type: 'so101',    name: 'SO-101',      w: 11,   d: 9,    reach: 44,   cat: 'robot' },
  ]},
  { group: '가구', items: [
    { type: 'desk',  name: '책상',        w: 160, d: 80, reach: 0, cat: 'furn' },
    { type: 'table', name: '작업 테이블', w: 120, d: 60, reach: 0, cat: 'furn' },
    { type: 'shelf', name: '선반',        w: 90,  d: 40, reach: 0, cat: 'furn' },
    { type: 'chair', name: '의자',        w: 55,  d: 55, reach: 0, cat: 'furn', round: true, soft: true },
  ]},
  { group: '장비', items: [
    { type: 'pc',     name: '워크스테이션', w: 25, d: 55,  reach: 0, cat: 'equip' },
    { type: 'tripod', name: '카메라 삼각대', w: 70, d: 70,  reach: 0, cat: 'equip', round: true },
  ]},
];
const CATS = ['furn', 'robot', 'equip', 'zone'];

/* ───────── helpers ───────── */
const $ = id => document.getElementById(id);
const rad = d => d * Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r2 = v => Math.round(v * 100) / 100;
const uid = () => 'i' + Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => { const v = Math.round(n * 10) / 10; return Number.isInteger(v) ? String(v) : v.toFixed(1); };
const num = (v, def, lo, hi) => { v = Number(v); return Number.isFinite(v) ? clamp(v, lo, hi) : def; };
const norm = a => ((a % 360) + 360) % 360;

const defaultRoom = () => ({ ...ROOM });
function defaultArms() {
  // 보유 로봇팔 4대. 위치는 임시로 방 가운데에 세워 둔 것
  const base = { cat: 'robot', rot: 0, soft: false, lock: false };
  return [
    { ...base, id: 'openarm', type: 'openarm2', name: 'OpenArm 2.0', x: 173.5, y: 300, w: 41, d: 25, reach: 60.6, armOff: 15.25, round: false },
    { ...base, id: 'xarm7', type: 'xarm7', name: 'xArm7', x: 173.5, y: 470, w: 12.6, d: 12.6, reach: 70, armOff: 0, round: true },
    { ...base, id: 'so101-1', type: 'so101', name: 'SO-101 #1', x: 125, y: 620, w: 11, d: 9, reach: 44, armOff: 0, round: false },
    { ...base, id: 'so101-2', type: 'so101', name: 'SO-101 #2', x: 225, y: 620, w: 11, d: 9, reach: 44, armOff: 0, round: false },
  ];
}
function defaultItems(room) {
  // 계획: 책상 2개를 실험실 끝(창문 쪽) 양쪽 벽에 하나씩, 창문에서 30cm
  return [
    { id: 'desk-l', type: 'desk', name: '책상 1', cat: 'furn', x: 40, y: 110, w: 160, d: 80, rot: 90, reach: 0, round: false, soft: false, lock: false },
    { id: 'desk-r', type: 'desk', name: '책상 2', cat: 'furn', x: room.w - 40, y: 110, w: 160, d: 80, rot: 90, reach: 0, round: false, soft: false, lock: false },
    ...defaultArms(),
  ].map(cleanItem);
}
function cleanItem(o) {
  o = o && typeof o === 'object' ? o : {};
  let id = String(o.id || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 24); if (!id) id = uid();
  return {
    id, type: String(o.type || 'custom').replace(/[^a-z0-9]/gi, '').slice(0, 16) || 'custom',
    name: String(o.name == null ? '물체' : o.name).slice(0, 40),
    cat: CATS.includes(o.cat) ? o.cat : 'furn',
    x: num(o.x, 100, -5000, 5000), y: num(o.y, 100, -5000, 5000),
    w: num(o.w, 50, 2, 2000), d: num(o.d, 50, 2, 2000),
    rot: norm(num(o.rot, 0, -36000, 36000)), reach: num(o.reach, 0, 0, 1000), armOff: num(o.armOff, 0, 0, 200),
    round: !!o.round, soft: !!o.soft, lock: !!o.lock,
  };
}
function cleanState(s) {
  s = s && typeof s === 'object' ? s : {};
  const room = defaultRoom(); // 방은 고정이므로 저장된 값은 쓰지 않음
  const seen = new Set();
  const items = (Array.isArray(s.items) ? s.items : []).slice(0, 200).map(cleanItem);
  if (s.v !== 2 && !items.some(it => SPECS[it.type])) items.push(...defaultArms().map(cleanItem)); // 이전 버전에서 저장한 배치에는 보유 로봇팔이 없음
  for (const it of items) if (it.type === 'openarm2' && it.w === 45 && it.d === 25 && it.armOff === 17.5) { it.w = 41; it.armOff = 15.25; } // 사진 추정값 → 공식 모델 치수
  items.forEach(it => { while (seen.has(it.id)) it.id = uid(); seen.add(it.id); });
  return { room, items };
}

/* ───────── geometry ───────── */
function poly(it) {
  const r = rad(it.rot), c = Math.cos(r), s = Math.sin(r), hw = it.w / 2, hd = it.d / 2;
  let pts;
  if (it.round) { pts = []; for (let k = 0; k < 16; k++) { const a = k / 16 * 2 * Math.PI; pts.push([Math.cos(a) * hw, Math.sin(a) * hd]); } }
  else pts = [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]];
  return pts.map(([x, y]) => [it.x + x * c - y * s, it.y + x * s + y * c]);
}
function bbox(P) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of P) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return { x0, y0, x1, y1 };
}
function overlap(A, B) { // separating-axis test on convex polygons; touching edges do not count
  for (const P of [A, B]) {
    for (let i = 0; i < P.length; i++) {
      const a = P[i], b = P[(i + 1) % P.length];
      let nx = b[1] - a[1], ny = a[0] - b[0]; const L = Math.hypot(nx, ny); if (!L) continue; nx /= L; ny /= L;
      let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
      for (const [x, y] of A) { const d = x * nx + y * ny; if (d < a0) a0 = d; if (d > a1) a1 = d; }
      for (const [x, y] of B) { const d = x * nx + y * ny; if (d < b0) b0 = d; if (d > b1) b1 = d; }
      if (Math.min(a1, b1) - Math.max(a0, b0) <= 0.05) return false;
    }
  }
  return true;
}
function ptSeg(p, a, b) {
  const vx = b[0] - a[0], vy = b[1] - a[1], L = vx * vx + vy * vy;
  let t = L ? ((p[0] - a[0]) * vx + (p[1] - a[1]) * vy) / L : 0; t = clamp(t, 0, 1);
  return Math.hypot(p[0] - a[0] - t * vx, p[1] - a[1] - t * vy);
}
function polyGap(A, B) {
  let m = Infinity;
  for (const [X, Y] of [[A, B], [B, A]]) for (const p of X) for (let i = 0; i < Y.length; i++) m = Math.min(m, ptSeg(p, Y[i], Y[(i + 1) % Y.length]));
  return m;
}
function swingPoly(R) {
  const hx = R.hinge === 'left' ? R.doorX : R.doorX + R.doorW, dir = R.hinge === 'left' ? 1 : -1, P = [[hx, R.d]];
  for (let k = 0; k <= 8; k++) { const t = k / 8 * Math.PI / 2; P.push([hx + dir * Math.cos(t) * R.doorW, R.d - Math.sin(t) * R.doorW]); }
  return P;
}
const solid = it => it.cat !== 'zone' && !it.soft;
const isSurface = it => it.type === 'desk' || it.type === 'table';
const isTop = it => TOP_TYPES.has(it.type);
const collides = (a, b) => solid(a) && solid(b) && !((isTop(a) && isSurface(b)) || (isTop(b) && isSurface(a)));
const layer = it => it.cat === 'zone' ? 0 : isSurface(it) ? 1 : isTop(it) ? 3 : 2;

function analyze() {
  const its = state.items, R = state.room;
  const P = its.map(poly), B = P.map(bbox);
  const sw = R.swing === 'in' ? swingPoly(R) : null;
  const out = its.map((it, i) => ({ bad: false, why: [], near: null, bb: B[i], poly: P[i],
    clear: { l: B[i].x0, r: R.w - B[i].x1, t: B[i].y0, b: R.d - B[i].y1 } }));
  its.forEach((it, i) => {
    const c = out[i].clear;
    if (Math.min(c.l, c.r, c.t, c.b) < -0.05) { out[i].bad = true; out[i].why.push('방 밖으로 나가 있습니다'); }
    if (sw && solid(it) && overlap(P[i], sw)) { out[i].bad = true; out[i].why.push('문이 열리는 반경을 막습니다'); }
  });
  for (let i = 0; i < its.length; i++) {
    for (let j = i + 1; j < its.length; j++) {
      if (!collides(its[i], its[j])) continue;
      if (overlap(P[i], P[j])) {
        out[i].bad = out[j].bad = true;
        out[i].why.push(`“${its[j].name}”와 겹칩니다`); out[j].why.push(`“${its[i].name}”와 겹칩니다`);
        out[i].near = { name: its[j].name, gap: 0 }; out[j].near = { name: its[i].name, gap: 0 };
      } else {
        const g = polyGap(P[i], P[j]);
        if (!out[i].near || g < out[i].near.gap) out[i].near = { name: its[j].name, gap: g };
        if (!out[j].near || g < out[j].near.gap) out[j].near = { name: its[i].name, gap: g };
      }
    }
  }
  return out;
}

/* ───────── state ───────── */
let state = (() => {
  try { const raw = localStorage.getItem(LS_STATE); if (raw) return cleanState(JSON.parse(raw)); } catch (e) {}
  const room = defaultRoom(); return { room, items: defaultItems(room) };
})();
const ui = { snap: 5, reach: true, measure: false, m: null, sel: null };
try { const u = JSON.parse(localStorage.getItem(LS_UI) || 'null'); if (u) { if ([0, 1, 5, 10].includes(u.snap)) ui.snap = u.snap; ui.reach = u.reach !== false; } } catch (e) {}
const view = { cx: 0, cy: 0, scale: 1, fitted: true };
let hist = [], hi = -1, action = null, lastAn = [], rafOn = false;
const pointers = new Map();

const svg = $('plan'), stage = $('stage');
const selItem = () => state.items.find(o => o.id === ui.sel) || null;
const snapshot = () => JSON.stringify({ v: 2, room: state.room, items: state.items });

function saveLocal() { try { localStorage.setItem(LS_STATE, snapshot()); } catch (e) {} }
function saveUi() { try { localStorage.setItem(LS_UI, JSON.stringify({ snap: ui.snap, reach: ui.reach })); } catch (e) {} }
function commit() {
  const s = snapshot(); if (hist[hi] === s) return;
  hist = hist.slice(0, hi + 1); hist.push(s); if (hist.length > 120) hist.shift(); hi = hist.length - 1;
  saveLocal(); pushShared(); syncToolbar();
}
function restore(s) {
  state = cleanState(JSON.parse(s)); if (!selItem()) ui.sel = null;
  if (view.fitted) fit(); schedule();
}
function undo() { if (hi > 0) { hi--; restore(hist[hi]); saveLocal(); pushShared(); syncToolbar(); } }

/* ───────── view ───────── */
const MAX_SCALE = 8;
const VIEW_PAD = { l: 36, r: 68, t: 28, b: 58 }; // 도면 둘레 여백 (px): 위 창문 표시, 오른쪽·아래 치수선. .work의 도면 열 폭 계산식과 맞춰 둠
function fitScale() {
  const cw = stage.clientWidth || 600, ch = stage.clientHeight || 600, P = VIEW_PAD, R = state.room;
  return Math.max(0.05, Math.min((cw - P.l - P.r) / (R.w + 2 * WALL_T), (ch - P.t - P.b) / (R.d + 2 * WALL_T)));
}
const clampScale = s => clamp(s, fitScale() * 0.5, MAX_SCALE);
function viewRange() { // 화면 중심이 움직일 수 있는 범위. 도면(방 + 벽 + 여백)이 화면보다 작은 축은 가운데 한 점
  const cw = stage.clientWidth || 600, ch = stage.clientHeight || 600, P = VIEW_PAD, R = state.room, s = view.scale;
  const ax = (a, b, half) => b - a <= 2 * half + 1e-6 ? [(a + b) / 2, (a + b) / 2] : [a + half, b - half];
  return { x: ax(-WALL_T - P.l / s, R.w + WALL_T + P.r / s, cw / 2 / s), y: ax(-WALL_T - P.t / s, R.d + WALL_T + P.b / s, ch / 2 / s) };
}
function clampView() {
  const v = viewRange();
  view.cx = clamp(view.cx, v.x[0], v.x[1]); view.cy = clamp(view.cy, v.y[0], v.y[1]);
}
function fit() { view.scale = fitScale(); view.fitted = true; clampView(); }
function toWorld(cx, cy) {
  const r = svg.getBoundingClientRect();
  return { x: view.cx + (cx - r.left - r.width / 2) / view.scale, y: view.cy + (cy - r.top - r.height / 2) / view.scale };
}
function zoomAt(factor, cx, cy) {
  const r = svg.getBoundingClientRect();
  if (cx == null) { cx = r.left + r.width / 2; cy = r.top + r.height / 2; }
  const w = toWorld(cx, cy), s = clampScale(view.scale * factor);
  view.scale = s; view.cx = w.x - (cx - r.left - r.width / 2) / s; view.cy = w.y - (cy - r.top - r.height / 2) / s;
  view.fitted = false; clampView(); schedule();
}

/* ───────── rendering ───────── */
function schedule() { if (rafOn) return; rafOn = true; requestAnimationFrame(render); }

function textEm(s) { let n = 0; for (const ch of s) n += ch.charCodeAt(0) > 0x2e7f ? 1 : 0.58; return n; }

function render() {
  rafOn = false;
  if (view.fitted) fit(); else { view.scale = clampScale(view.scale); clampView(); }
  const s = view.scale, px = n => +(n / s).toFixed(3);
  const cw = stage.clientWidth || 600, ch = stage.clientHeight || 600;
  svg.setAttribute('viewBox', `${view.cx - cw / 2 / s} ${view.cy - ch / 2 / s} ${cw / s} ${ch / s}`);
  const R = state.room, W = R.w, D = R.d, T = WALL_T;
  const an = lastAn = analyze();
  const fs = px(10.5);
  let h = '';

  h += `<defs>
    <pattern id="g10" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" class="g-minor" stroke-width="${px(1)}"/></pattern>
    <pattern id="g50" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" class="g-mid" stroke-width="${px(1)}"/></pattern>
    <pattern id="g100" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" class="g-major" stroke-width="${px(1.6)}"/></pattern>
    <pattern id="hatch" width="${px(9)}" height="${px(9)}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="${px(9)}" class="hatch-line" stroke-width="${px(1.6)}"/></pattern>
    <clipPath id="roomclip"><rect x="0" y="0" width="${W}" height="${D}"/></clipPath>
  </defs>`;

  // floor + grid (10 cm / 50 cm / 1 m)
  h += `<rect class="floor" x="0" y="0" width="${W}" height="${D}"/>`;
  if (s * 10 >= 6) h += `<rect x="0" y="0" width="${W}" height="${D}" fill="url(#g10)" pointer-events="none"/>`;
  if (s * 50 >= 14) h += `<rect x="0" y="0" width="${W}" height="${D}" fill="url(#g50)" pointer-events="none"/>`;
  h += `<rect x="0" y="0" width="${W}" height="${D}" fill="url(#g100)" pointer-events="none"/>`;

  // items: zones first, then reach circles, then solid objects
  const order = state.items.map((it, i) => i).sort((a, b) => layer(state.items[a]) - layer(state.items[b]));
  let zones = '', bodies = '', reach = '';
  for (const i of order) {
    const it = state.items[i], a = an[i];
    const g = itemSvg(it, a, px, fs);
    if (it.cat === 'zone') zones += g; else bodies += g;
    if (ui.reach && it.reach > 0) {
      const rr = rad(it.rot), offs = it.armOff > 0 ? [-it.armOff, it.armOff] : [0]; // 양팔은 어깨마다 하나씩
      for (const o of offs) reach += `<circle class="reach" cx="${r2(it.x + o * Math.cos(rr))}" cy="${r2(it.y + o * Math.sin(rr))}" r="${it.reach}" stroke-width="${px(1)}" stroke-dasharray="${px(4)} ${px(3)}"/>`;
    }
  }
  h += zones + `<g clip-path="url(#roomclip)">${reach}</g>` + bodies;

  // walls, window, door
  h += `<path class="wall" fill-rule="evenodd" d="M${-T} ${-T}H${W + T}V${D + T}H${-T}Z M0 0V${D}H${W}V0Z"/>`;
  if (R.winW > 0) {
    h += `<rect class="win" x="${R.winX}" y="${-T}" width="${R.winW}" height="${T}" stroke-width="${px(1)}"/>`;
    h += `<line class="win-line" x1="${R.winX}" y1="${-T / 2}" x2="${R.winX + R.winW}" y2="${-T / 2}" stroke-width="${px(1)}"/>`;
    h += `<text class="tag" x="${R.winX + R.winW / 2}" y="${-T - px(8)}" font-size="${fs}" text-anchor="middle">창문</text>`;
  }
  {
    const hx = R.hinge === 'left' ? R.doorX : R.doorX + R.doorW, jx = R.hinge === 'left' ? R.doorX + R.doorW : R.doorX;
    const sy = R.swing === 'in' ? -1 : 1, y0 = R.swing === 'in' ? D : D + T, ty = y0 + sy * R.doorW;
    const sweep = (R.hinge === 'left') === (R.swing === 'in') ? 1 : 0;
    h += `<rect class="opening" x="${R.doorX}" y="${D}" width="${R.doorW}" height="${T}"/>`;
    h += `<path class="door-arc" d="M${hx} ${ty}A${R.doorW} ${R.doorW} 0 0 ${sweep} ${jx} ${y0}" stroke-width="${px(0.8)}"/>`;
    h += `<line class="door-leaf" x1="${hx}" y1="${y0}" x2="${hx}" y2="${ty}" stroke-width="${px(1.8)}"/>`;
  }

  // measured dimensions
  const tick = (x, y) => `<line x1="${x - px(3.5)}" y1="${y + px(3.5)}" x2="${x + px(3.5)}" y2="${y - px(3.5)}" stroke-width="${px(1.1)}"/>`;
  const extV = (x, y) => `<line x1="${x}" y1="${D + T + px(5)}" x2="${x}" y2="${y + px(5)}" stroke-width="${px(0.7)}"/>`; // 치수 보조선: 벽에서 조금 띄움
  const extH = (y, x) => `<line x1="${W + T + px(5)}" y1="${y}" x2="${x + px(5)}" y2="${y}" stroke-width="${px(0.7)}"/>`;
  const dimH = (x1, x2, y, label) => `<g class="dim">${extV(x1, y)}${extV(x2, y)}<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke-width="${px(0.7)}"/>${tick(x1, y)}${tick(x2, y)}<text x="${(x1 + x2) / 2}" y="${y - px(5)}" font-size="${fs}" text-anchor="middle">${esc(label)}</text></g>`;
  const dimV = (y1, y2, x, label, side) => { const tx = side < 0 ? x - px(5) : x + px(14), ty = (y1 + y2) / 2;
    return `<g class="dim">${extH(y1, x)}${extH(y2, x)}<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke-width="${px(0.7)}"/>${tick(x, y1)}${tick(x, y2)}<text x="${tx}" y="${ty}" font-size="${fs}" text-anchor="middle" transform="rotate(-90 ${tx} ${ty})">${esc(label)}</text></g>`; };
  const yb1 = D + T + px(22), yb2 = D + T + px(44);
  const segsX = [[0, R.doorX, ''], [R.doorX, R.doorX + R.doorW, '문 '], [R.doorX + R.doorW, W, '']].filter(q => q[1] - q[0] > 0.5);
  for (const [a, b, pre] of segsX) h += dimH(a, b, yb1, pre + fmt(b - a));
  h += dimH(0, W, yb2, '가로 ' + fmt(W));
  h += dimV(0, D, W + T + px(22), '세로 ' + fmt(D), 1);

  // selection overlay
  const si = state.items.findIndex(o => o.id === ui.sel);
  if (si >= 0) {
    const it = state.items[si], a = an[si], bb = a.bb, c = a.clear;
    h += `<polygon class="sel-outline" points="${a.poly.map(p => p.join(',')).join(' ')}" stroke-width="${px(1.5)}"/>`;
    const my = clamp((bb.y0 + bb.y1) / 2, 0, D), mx = clamp((bb.x0 + bb.x1) / 2, 0, W);
    let cl = '';
    const hl = (x1, x2) => { if (x2 - x1 >= 1) cl += `<line x1="${x1}" y1="${my}" x2="${x2}" y2="${my}" stroke-width="${px(0.8)}" stroke-dasharray="${px(3)} ${px(2)}"/><text x="${(x1 + x2) / 2}" y="${my - px(4)}" font-size="${fs}" stroke-width="${px(3)}" text-anchor="middle">${fmt(x2 - x1)}</text>`; };
    const vl = (y1, y2) => { if (y2 - y1 >= 1) cl += `<line x1="${mx}" y1="${y1}" x2="${mx}" y2="${y2}" stroke-width="${px(0.8)}" stroke-dasharray="${px(3)} ${px(2)}"/><text x="${mx + px(5)}" y="${(y1 + y2) / 2 + px(4)}" font-size="${fs}" stroke-width="${px(3)}">${fmt(y2 - y1)}</text>`; };

    if (!it.lock) {

      h += `<line class="stem" x1="${ex}" y1="${ey}" x2="${hx}" y2="${hy}" stroke-width="${px(1.5)}"/>`;
      h += `<circle class="hit" data-role="rot" cx="${hx}" cy="${hy}" r="${px(17)}"/><circle class="handle" data-role="rot" cx="${hx}" cy="${hy}" r="${px(5)}" stroke-width="${px(1.5)}"/>`;
    }
  }

  // tape measure
  if (ui.m) {
    const { a, b } = ui.m, len = Math.hypot(b.x - a.x, b.y - a.y);
    h += `<g class="meas"><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke-width="${px(1.6)}"/><circle cx="${a.x}" cy="${a.y}" r="${px(3)}"/><circle cx="${b.x}" cy="${b.y}" r="${px(3)}"/>`;
    h += `<text x="${(a.x + b.x) / 2}" y="${(a.y + b.y) / 2 - px(7)}" font-size="${px(12)}" stroke-width="${px(3.5)}" text-anchor="middle">${fmt(len)} cm</text></g>`;
  }

  svg.innerHTML = h;
  $('t-fit').textContent = Math.round(s / fitScale() * 100) + '%';
  svg.classList.toggle('measuring', ui.measure);
  renderStatus(); renderList(); syncInspector(); mvSync();
}

function itemSvg(it, a, px, fs) {
  const hw = it.w / 2, hd = it.d / 2;
  const cls = ['item', 'cat-' + it.cat, a.bad ? 'bad' : '', it.lock ? 'locked' : ''].join(' ');
  let g = `<g class="${cls}" data-id="${it.id}" transform="translate(${it.x} ${it.y}) rotate(${it.rot})">`;
  const dash = it.cat === 'zone' ? ` stroke-dasharray="${px(7)} ${px(4)}"` : '';
  if (it.round) {
    g += `<ellipse class="body" rx="${hw}" ry="${hd}" stroke-width="${px(1.2)}"${dash}/>`;
  } else {
    g += `<rect class="body" x="${-hw}" y="${-hd}" width="${it.w}" height="${it.d}" rx="${Math.min(1, hw, hd)}" stroke-width="${px(1.2)}"${dash}/>`;
    if (it.cat === 'zone') g += `<rect class="hatch" x="${-hw}" y="${-hd}" width="${it.w}" height="${it.d}" fill="url(#hatch)"/>`;
  }
  if (Math.min(it.w, it.d) < px(26)) g += `<circle class="hit-pad" r="${px(13)}"/>`; // 작은 물체도 잡기 쉽게
  if (it.cat === 'robot') { // heading marker on the front edge
    const t = clamp(Math.min(hw, hd) * 0.3, 2, 7), m = Math.min(2, hd * 0.2);
    g += `<path class="mark" d="M0 ${-hd + m}l${t} ${t * 1.4}h${-2 * t}z" pointer-events="none"/>`;
    if (it.type === 'arm') g += `<circle class="inner" r="${Math.min(hw, hd) * 0.55}" stroke-width="${px(1.2)}" pointer-events="none"/>`;
  }
  // upright label
  const r = rad(it.rot), ca = Math.abs(Math.cos(r)), sa = Math.abs(Math.sin(r));
  const aw = it.w * ca + it.d * sa, ah = it.w * sa + it.d * ca;
  const em = Math.max(1, textEm(it.name)), dims = `${fmt(it.w)}×${fmt(it.d)}`;
  let f = fs * 1.05, inside = f * em <= aw * 0.92 && ah >= f * 1.5;
  if (!inside) { const f2 = aw * 0.92 / em; if (f2 >= fs * 0.78 && ah >= f2 * 1.5) { f = f2; inside = true; } }
  g += `<g transform="rotate(${-it.rot})">`;
  if (inside) {
    const two = ah >= f * 3.2 && fs * 0.9 * 0.6 * dims.length <= aw * 0.92;
    g += `<text class="lbl" y="${two ? -f * 0.15 : f * 0.36}" font-size="${f}" text-anchor="middle">${esc(it.name)}</text>`;
    if (two) g += `<text class="lbl sub" y="${f * 1.1}" font-size="${fs * 0.9}" text-anchor="middle">${dims}</text>`;
  } else {
    g += `<text class="lbl out" y="${ah / 2 + fs * 1.25}" font-size="${fs}" stroke-width="${px(3)}" text-anchor="middle">${esc(it.name)}</text>`;
  }
  return g + '</g></g>';
}

let cursorTxt = '';

    `<span>방 <b>${(R.w / 100).toFixed(2)} × ${(R.d / 100).toFixed(2)} m</b> · <b>${(R.w * R.d / 10000).toFixed(1)} m²</b></span>` +

/* ───────── inspector ───────── */
const F = { name: $('f-name'), w: $('f-w'), d: $('f-d'), rot: $('f-rot'), reach: $('f-reach'), left: $('f-left'), top: $('f-top'), lock: $('f-lock') };
function setVal(el, v) { if (document.activeElement !== el && el.value !== String(v)) el.value = v; }

}
function bindNum(el, fn) {

  el.addEventListener('change', () => { commit(); schedule(); });
}
F.name.addEventListener('input', () => { const it = selItem(); if (it) { it.name = F.name.value.slice(0, 40) || '물체'; schedule(); } });
F.name.addEventListener('change', () => commit());

$('b-rot').addEventListener('click', () => rotateSel(90));

/* ───────── editing operations ───────── */
function halfExt(it) { const b = bbox(poly({ ...it, x: 0, y: 0 })); return { hx: (b.x1 - b.x0) / 2, hy: (b.y1 - b.y0) / 2 }; }
function placeSnapped(it, nx, ny) {
  const R = state.room, g = ui.snap, { hx, hy } = halfExt(it);
  let x0 = nx - hx, y0 = ny - hy;
  if (g) {
    x0 = Math.round(x0 / g) * g; y0 = Math.round(y0 / g) * g;
    const th = Math.max(g, 4) * 0.8;
    if (Math.abs(x0) < th) x0 = 0; else if (Math.abs(R.w - (x0 + 2 * hx)) < th) x0 = R.w - 2 * hx;
    if (Math.abs(y0) < th) y0 = 0; else if (Math.abs(R.d - (y0 + 2 * hy)) < th) y0 = R.d - 2 * hy;
  }
  it.x = r2(clamp(x0 + hx, 0, R.w)); it.y = r2(clamp(y0 + hy, 0, R.d));
}
function freeSpot(it, tx, ty) {
  const R = state.room, blockers = state.items.filter(o => o !== it && collides(it, o)).map(poly);
  if (R.swing === 'in') blockers.push(swingPoly(R));
  let best = null, bd = Infinity;
  for (let y = 0; y <= R.d; y += 5) for (let x = 0; x <= R.w; x += 5) {
    const d = (x - tx) ** 2 + (y - ty) ** 2; if (d >= bd) continue;
    const p = poly({ ...it, x, y }), b = bbox(p);

    if (solid(it) && blockers.some(o => overlap(p, o))) continue;
    best = [x, y]; bd = d;
  }
  it.x = best ? best[0] : clamp(tx, 0, R.w); it.y = best ? best[1] : clamp(ty, 0, R.d);
  return !!best;
}
function addFromCatalog(def) {
  const n = state.items.filter(o => o.type === def.type).length + 1;
  const it = cleanItem({ ...def, id: uid(), name: `${def.name} ${n}`, rot: 0 });
  const R = state.room, ok = freeSpot(it, clamp(view.cx, 0, R.w), clamp(view.cy, 0, R.d));
  state.items.push(it); ui.sel = it.id; commit(); schedule();
  if (!ok) toast('빈자리가 없어 겹친 채로 놓았습니다. 옮겨서 자리를 잡아 주세요.');
}
function rotateSel(deg) { const it = selItem(); if (!it || it.lock) return; it.rot = norm(it.rot + deg); commit(); schedule(); }
function deleteSel() { const it = selItem(); if (!it) return; state.items = state.items.filter(o => o !== it); ui.sel = null; commit(); schedule(); }

const mvPoseMark = i => [...mvEl.poses.children].forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));

/* ───────── robot gallery (shown while no robot is open) ─────────

  b.type = 'button'; b.className = 'gt loading'; b.setAttribute('aria-label', `${def.title} 3D 모델 열기`);
